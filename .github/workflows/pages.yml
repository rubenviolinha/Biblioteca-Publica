name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Build styles
        run: npm ci && npm run build:css
      - name: Install PDF generator
        run: python -m pip install -r requirements.txt
      - name: Compile book data
        run: python scripts/build_books.py
      - name: Generate PDF downloads
        run: python scripts/build_pdfs.py
      - name: Build searchable editions and site metadata
        run: python scripts/build_seo.py --output-dir dist
      - name: Validate book imports and searchable pages
        run: python -m unittest discover -s tests -v
        env:
          SITE_OUTPUT_DIR: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish the site
        id: deployment
        uses: actions/deploy-pages@v4
